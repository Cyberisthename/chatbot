name: Y-Z-G primitive tests
on:
  push:
    branches: [research/y-z-primitive-corrections]
  pull_request:
    branches: [main]
jobs:
  focused-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pytest numpy
      - run: PYTHONPATH=quantacap/src python -m pytest -q quantacap/tests/test_primitive_corrections.py
